seed: 13

experiment:
  name: llada_220m_uniform_single_gpu_pilot
  type: diffusion_pretraining

data:
  center_corpus: data/BiochemT5/pretrain_corpus_biochem_bench_clean/pretrain.jsonl
  dataset_type: indexed
  index_path: data/BiochemT5/pretrain_corpus_biochem_bench_clean/pretrain.index.pkl
  max_records: null
  max_sequence_length: 2048
  ec_views_per_record: 1
  task_probs: {forward: 0.35, retro: 0.35, mlm: 0.30}

masking:
  weighted: false
  timestep_min: 0.001
  base_weight: 1.0
  neighbor_weight: 1.0
  center_weight: 1.0
  mlm_use_mapped_rxn: true

tokenizer:
  path: data/BiochemT5/tokenizer/smiles_wordlevel_final_vocab.json
  rebuild: false

model:
  family: llada
  hidden_size: 768
  intermediate_size: 3072
  num_hidden_layers: 24
  num_attention_heads: 12
  max_position_embeddings: 2048
  rms_norm_eps: 0.000001
  rope_theta: 10000
  hidden_dropout: 0.0
  attention_dropout: 0.0
  projection_dim: 256
  length_buckets: [64, 128, 256, 512, 768]
  length_loss_weight: 0.1

loss: {ec_contrastive: 0.0}

train:
  output_dir: outputs/BiochemT5/pilots/llada_220m_uniform_single_gpu_100step
  batch_size: 8
  gradient_accumulation_steps: 4
  num_workers: 2
  pin_memory: true
  learning_rate: 0.0002
  min_learning_rate: 0.00002
  betas: [0.9, 0.95]
  weight_decay: 0.1
  warmup_steps: 100
  max_steps: 100
  fixed_checkpoint_step: -1
  save_every: 100
  log_every: 10
  auto_resume: false
  mixed_precision: bf16
  gradient_checkpointing: true
  max_grad_norm: 1.0
  use_cuda: true
  sampler: {type: random}

validation:
  enabled: true
  val_fraction: 0.01
  split_seed: 13
  seed: 10013
  every_steps: 100
  batch_size: 8
  num_workers: 2
  max_batches: 10
  early_stopping_patience: 0

logging:
  wandb: {enabled: false}
