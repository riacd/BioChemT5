seed: 13

experiment:
  name: ec_hierarchy_t5_base_100k
  type: ec_hierarchy_ablation

data:
  center_corpus: data/BiochemT5/pretrain_corpus/cluster_centers.rsmiles_aug20.centered.jsonl
  index_path: data/BiochemT5/pretrain_corpus/cluster_centers.rsmiles_aug20.centered.index.pkl
  dataset_type: indexed
  max_records: null
  max_source_length: 1200
  max_target_length: 768
  ec_views_per_record: 1
  task_probs:
    forward: 0.35
    retro: 0.35
    mlm: 0.30

masking:
  mask_fraction: 0.15
  mean_span_len: 3.0
  base_weight: 1.0
  center_weight: 4.0
  neighbor_weight: 2.0
  mlm_use_mapped_rxn: true

tokenizer:
  path: data/BiochemT5/tokenizer/smiles_wordlevel_final_vocab.json
  rebuild: false
  max_records: null
  vocab_size: 4096

model:
  d_model: 768
  d_ff: 3072
  d_kv: 64
  num_layers: 12
  num_decoder_layers: 12
  num_heads: 12
  relative_attention_num_buckets: 32
  relative_attention_max_distance: 128
  layer_norm_epsilon: 0.000001
  feed_forward_proj: relu
  dropout_rate: 0.1
  projection_dim: 256

loss:
  ec_contrastive: 0.1
  temperature: 0.07

ec:
  contrastive:
    enabled: true
    level_weights:
      ec1: 0.1
      ec2: 0.2
      ec3: 0.3
      ec4: 0.4
  text_prediction:
    enabled: false

train:
  output_dir: outputs/BiochemT5/production/ec_hierarchy_t5_base_100k
  num_workers: 2
  pin_memory: true
  learning_rate: 0.0001
  max_grad_norm: 1.0
  max_steps: 100000
  log_every: 10
  save_every: 1000
  auto_resume: true
  gradient_accumulation_steps: 1
  mixed_precision: bf16
  gradient_checkpointing: true
  ddp_static_graph: true
  ddp_find_unused_parameters: false
  use_cuda: true
  sampler:
    type: ec_hierarchical
    groups_per_batch: 4
    seq2seq_only_samples_per_batch: 4

validation:
  enabled: true
  val_fraction: 0.01
  split_seed: 13
  every_steps: 1000
  batch_size: 28
  num_workers: 2
  max_batches: 100

logging:
  wandb:
    enabled: true
    mode: offline
    project: BioChemT5
    name: ec_hierarchy_t5_base_100k
    dir: .
    tags: [production, ablation, ec-hierarchy, forward-retro-span, reaction-center, t5-base]
